name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  link-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:docker-smoke

  deploy:
    needs: [link-crawl, docker-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/web_site
            git pull origin main
            docker compose up -d --build
            # Recreate edge proxy so volume-mounted Caddyfile is always applied
            # (caddy reload can no-op if admin API state is stale).
            docker compose up -d --force-recreate --no-deps caddy
            docker compose ps
            # Smoke: apex and /index.html must 301/308 to www canonical URLs
            curl -sI -o /dev/null -w "apex:%{http_code}:%{redirect_url}\n" https://bespoke-ai.ie/ || true
            curl -sI -o /dev/null -w "index:%{http_code}:%{redirect_url}\n" https://www.bespoke-ai.ie/index.html || true
